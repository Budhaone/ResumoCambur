    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f35b04 0%, #ff0033 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 40px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 15px 0 5px 10px;
            opacity: 0.9;
        }

        .btn {
            background-color: #1e2869;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, background-color 0.2s ease;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn-wsp {
            background-color: #25d366 !important;
            color: #ffffff !important;
            font-weight: 700;
        }

        .btn-file {
            background-color: #ffffff !important;
            color: #1e2869 !important;
            font-weight: 600;
            text-transform: none !important;
            justify-content: flex-start !important;
            padding-left: 20px !important;
            text-align: left !important;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-back {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

            </div>

        <!-- TELA 2: SUBMENU DO EMPREENDIMENTO -->

            <div class="header">
                <h1 id="project-title">Empreendimento</h1>
            </div>

            <a id="link-wsp" class="btn btn-wsp" href="#" target="_blank">FALAR COM O CORRETOR</a>

            <button class="btn" onclick="handleCategory('plantas')">PLANTAS E IMPLANTAÇÃO</button>
            <button class="btn" onclick="handleCategory('tabela')">TABELA DE VENDAS</button>
            <button class="btn" onclick="handleCategory('ficha')">FICHA E DOCUMENTOS</button>
        </div>

        function openProject(key) {
            currentProjectKey = key;
            const data = projectsData[key];
            if (!data) return;

            document.getElementById('project-title').innerText = data.title;
            document.getElementById('link-wsp').href = `https://wa.me/${meuWhatsapp}?text=Olá,%20tenho%20interesse%20no%20empreendimento%20${encodeURIComponent(data.title)}`;
            
            const btnFilme = document.getElementById('link-filme');
            if (data.filme && data.filme !== '#') {
                btnFilme.href = data.filme;
                btnFilme.style.display = 'flex';
            } else {
                btnFilme.style.display = 'none';
            }

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-project').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function handleCategory(category) {
            const data = projectsData[currentProjectKey];
            if (!data || !data[category]) return;

            const files = data[category];

            if (files.length === 0) {
                alert('Material em breve para este empreendimento!');
                return;
            }

            if (files.length === 1) {
                window.open(files[0].url, '_blank');
                return;
            }

            const sublistContainer = document.getElementById('files-list');
            sublistContainer.innerHTML = '';

            const titulos = {
                'book': 'Books Digitais',
                'imagens': 'Galeria de Imagens 3D',
                'plantas': 'Plantas & Implantação',
                'tabela': 'Tabela de Vendas',
                'ficha': 'Ficha & Documentos'
            };

            document.getElementById('sublist-title').innerText = titulos[category] || 'Arquivos';

            files.forEach(file => {
                const a = document.createElement('a');
                a.className = 'btn btn-file';
                a.href = file.url;
                a.target = '_blank';
                a.innerText = `📄 ${file.name}`;
                sublistContainer.appendChild(a);
            });

            document.getElementById('view-project').classList.add('hidden');
            document.getElementById('view-sublist').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.getElementById('view-project').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

            document.getElementById('view-sublist').classList.add('hidden');

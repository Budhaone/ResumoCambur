<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* PALETA AZUL PREMIUM NOCTURNE */
            background: linear-gradient(180deg, #1e3a8a 0%, #0b1329 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 40px 15px;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }

        /* TÍTULOS E SOBRETÍTULOS COM FONTE SERIFADA DE LUXO */
        .header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-style: italic;
        }

        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            color: #93c5fd;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 15px 0 5px 10px;
        }

        /* BOTÕES EM POPPINS ENCORPADA */
        .btn {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: transform 0.1s ease, background-color 0.2s ease;
            cursor: pointer;
            border: 1px solid rgba(147, 197, 253, 0.25);
            width: 100%;
        }

        .btn-wsp {
            background-color: #25d366 !important;
            color: #ffffff !important;
            font-weight: 800;
            border: none !important;
        }

        .btn-file {
            background-color: #ffffff !important;
            color: #0f172a !important;
            font-weight: 700;
            text-transform: none !important;
            justify-content: flex-start !important;
            padding-left: 20px !important;
            text-align: left !important;
            border: none !important;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-back {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .view {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* --- VISUALIZADOR EM TELA CHEIA (MODAL) --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 38px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            line-height: 1;

        function isImage(url) {
            return url.match(/\.(jpg|jpeg|png|webp)$/i);
        }

        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('modal-img').src = '';
        }

        function openProject(key) {
            currentProjectKey = key;
            const data = projectsData[key];
            if (!data) return;

            document.getElementById('project-title').innerText = data.title;
            document.getElementById('link-wsp').href = `https://wa.me/${meuWhatsapp}?text=Olá,%20tenho%20interesse%20no%20empreendimento%20${encodeURIComponent(data.title)}`;
            
            const btnFilme = document.getElementById('link-filme');
            if (data.filme && data.filme !== '#') {
                btnFilme.href = data.filme;
                btnFilme.style.display = 'flex';
            } else {
                btnFilme.style.display = 'none';
            }

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-project').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function handleCategory(category) {
            const data = projectsData[currentProjectKey];
            if (!data || !data[category]) return;

            const files = data[category];

            if (files.length === 0) {
                alert('Material em breve para este empreendimento!');
                return;
            }

            if (files.length === 1) {
                if (isImage(files[0].url)) {
                    openModal(files[0].url);
                } else {
                    window.open(files[0].url, '_blank');
                }
                return;
            }

            const sublistContainer = document.getElementById('files-list');
            sublistContainer.innerHTML = '';

            const titulos = {
                'book': 'Books Digitais',
                'imagens': 'Galeria de Imagens 3D',
                'plantas': 'Plantas & Implantação',
                'tabela': 'Tabela de Vendas',
                'ficha': 'Ficha & Documentos'
            };

            document.getElementById('sublist-title').innerText = titulos[category] || 'Arquivos';

            files.forEach(file => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-file';
                btn.innerText = `📄 ${file.name}`;
                btn.onclick = () => {
                    if (isImage(file.url)) {
                        openModal(file.url);
                    } else {
                        window.open(file.url, '_blank');
                    }
                };
                sublistContainer.appendChild(btn);
            });

            document.getElementById('view-project').classList.add('hidden');
            document.getElementById('view-sublist').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.getElementById('view-project').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function goProject() {
            document.getElementById('view-sublist').classList.add('hidden');
            document.getElementById('view-project').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
